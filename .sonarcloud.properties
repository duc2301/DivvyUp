# Cấu hình phân tích tự động của SonarQube Cloud (dự án duc2301_DivvyUp).
# Đọc/soát kết quả: node scripts/sonar/fetch-report.mjs, agent sonar-triage,
# skill sonar-maintain.

# Không đo trùng lặp ở:
# - supabase/migrations: mỗi migration `create or replace` lại cả hàm để sửa vài
#   dòng; migration đã chạy thì không được sửa — trùng là tất yếu, không phải nợ.
# - icons.ts: danh sách icon phải lặp 3 lần (import, cssInterop, export).
# - file test: dữ liệu ca kiểm cố ý viết cứng, lặp lại giữa các ca.
sonar.cpd.exclusions=supabase/migrations/**,src/components/ui/icons.ts,**/*.test.ts,**/*.test.mjs

# Luật PL/SQL (Oracle) áp nhầm lên migration Postgres.
sonar.issue.ignore.multicriteria=plsqlOnMigrations
sonar.issue.ignore.multicriteria.plsqlOnMigrations.ruleKey=plsql:*
sonar.issue.ignore.multicriteria.plsqlOnMigrations.resourceKey=supabase/migrations/**

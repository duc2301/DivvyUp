# Build APK trên EAS và đính vào GitHub Release của tag.
#
# Ba cách chạy:
#   - auto-release.yml gọi qua workflow_call khi phần native đổi (cách thường dùng);
#   - tạo Release bằng tay trên GitHub (release: published);
#   - chạy tay (workflow_dispatch) cho một tag đã có release.
# Release tạo bằng GITHUB_TOKEN KHÔNG kích sự kiện release: published — đó là lý
# do auto-release gọi thẳng workflow này thay vì trông vào sự kiện.
name: Release APK

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Tag của release (vd v1.1.0)
        type: string
        required: true
    secrets:
      EXPO_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag của release đã tạo (vd v1.0.1)
        required: true

permissions:
  contents: write

concurrency:
  group: release-apk-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build APK and attach to release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches app.json version
        run: |
          version=$(jq -r '.expo.version' app.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG không khớp version $version trong app.json. Sửa app.json thành ${TAG#v} (hoặc đặt tag v$version) rồi tạo lại release."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Cài dependency TRƯỚC khi nạp EXPO_TOKEN vào môi trường: script cài đặt
      # của một package bị chiếm quyền không đọc được token.
      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK on EAS
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > build.json
          apk_url=$(jq -r '.[0].artifacts.buildUrl // empty' build.json)
          if [ -z "$apk_url" ]; then
            echo "::error::EAS không trả về link APK"
            cat build.json
            exit 1
          fi
          echo "APK_URL=$apk_url" >> "$GITHUB_ENV"

      - name: Download APK
        run: curl --fail --location --retry 3 --output "DivvyUp-${TAG}.apk" "$APK_URL"

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "DivvyUp-${TAG}.apk" --clobber --repo "$GITHUB_REPOSITORY"
